name: Refresh winner study data

on:
  schedule:
    - cron: "30 8 * * 1-5"   # 14:00 IST hedge run
    - cron: "30 13 * * 1-5"  # 19:00 IST
  workflow_dispatch:

concurrency:
  group: refresh

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        run: python pipeline.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ constituents.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git push
          fi

  deploy-pages:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Assemble site
        run: |
          mkdir -p site/data
          cp index.html site/
          cp data/screener.json site/data/
          cp data/study.json site/data/
          cp data/history.json site/data/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
